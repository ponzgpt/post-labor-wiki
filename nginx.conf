server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/xml image/svg+xml;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
  # Only /_astro/ files carry content hashes; everything else (incl. the Pagefind index) must revalidate.
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
