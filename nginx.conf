# Pages moved in the v3 reorganisation (research/IA-v3.md §7, src/data/redirects.json): permanent redirects.
map $uri $plw_moved {
  default "";
  "/start-here/post-labor-in-five-minutes/" "/start/five-minutes/";
  "/start-here/post-labor-in-five-minutes" "/start/five-minutes/";
  "/start-here/why-now/" "/start/why-now/";
  "/start-here/why-now" "/start/why-now/";
  "/start-here/how-we-source/" "/start/how-to-read/";
  "/start-here/how-we-source" "/start/how-to-read/";
  "/start-here/" "/start/";
  "/start-here" "/start/";
  "/timeline/" "/start/timeline/";
  "/timeline" "/start/timeline/";
  "/measures/" "/evidence/";
  "/measures" "/evidence/";
  "/evidence/farms-and-factories/" "/evidence/historical-analogues/";
  "/evidence/farms-and-factories" "/evidence/historical-analogues/";
  "/glossary/" "/reference/glossary/";
  "/glossary" "/reference/glossary/";
  "/people/" "/reference/people/";
  "/people" "/reference/people/";
  "/reading-list/" "/reference/reading-list/";
  "/reading-list" "/reference/reading-list/";
  "/bibliography/" "/reference/bibliography/";
  "/bibliography" "/reference/bibliography/";
  "/credits/" "/reference/credits/";
  "/credits" "/reference/credits/";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  if ($plw_moved) { return 301 $plw_moved; }
  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
  # Only /_astro/ files carry content hashes; everything else (incl. the Pagefind index) must revalidate.
  location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
